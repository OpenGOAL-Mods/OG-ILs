[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opengoal-replay-server"
version = "0.1.0"
description = "Hosted replay and Speedrun.com integration for OpenGOAL ILs"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[tool.setuptools]
packages = ["speedrun_submitter"]
py-modules = ["run_replay_server"]
